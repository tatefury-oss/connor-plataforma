name: Pruebas
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connor
          POSTGRES_PASSWORD: connor_ci_pw
          POSTGRES_DB: connor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U connor" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://connor:connor_ci_pw@localhost:5432/connor_test
      WHATSAPP_VERIFY_TOKEN: test-verify-token
      WHATSAPP_APP_SECRET: test-app-secret
      WHATSAPP_ACCESS_TOKEN: test-access-token
      WHATSAPP_PHONE_NUMBER_ID: "123456"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: node --test --test-concurrency=1 test/*.test.js
