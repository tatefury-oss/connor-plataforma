# Nginx como proxy HTTPS delante de la aplicación (certificado con Let's Encrypt / certbot).
# Copiar a /etc/nginx/sites-available/connor y ajustar el dominio.
server {
  listen 80;
  server_name connor.mx www.connor.mx;
  return 301 https://connor.mx$request_uri;
}

server {
  listen 443 ssl http2;
  server_name connor.mx;

  ssl_certificate     /etc/letsencrypt/live/connor.mx/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/connor.mx/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 64m;   # cargas de fotos, video y documentos
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket para la sincronización en tiempo real
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
