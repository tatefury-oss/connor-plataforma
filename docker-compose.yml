# Despliegue de referencia en un servidor (VPS) con Docker.
# 1) cp .env.example .env y completa los valores (ver docs/OPERACION.md).
# 2) docker compose up -d db
# 3) docker compose run --rm migrate      (aplica migraciones como dueño de la base)
# 4) docker compose exec -T db psql -U connor connor -v app_password="'...'" -f /deploy/db-roles.sql
# 5) docker compose up -d app
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: connor
      POSTGRES_USER: connor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy:/deploy:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connor -d connor"]
      interval: 10s
      retries: 5

  # Migraciones con el usuario dueño; se ejecuta a mano, después de respaldar.
  migrate:
    build: .
    profiles: ["tools"]
    command: ["node", "src/migrate.js"]
    environment:
      DATABASE_URL: postgres://connor:${POSTGRES_PASSWORD}@db:5432/connor
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      AUTO_MIGRATE: "0"
      # La aplicación usa el usuario restringido (deploy/db-roles.sql).
      DATABASE_URL: postgres://connor_app:${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}@db:5432/connor
      UPLOAD_DIR: /data/uploads
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
